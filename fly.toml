# Fly.io deployment config for the game WebSocket server.
#
# First-time setup:
#   fly auth login
#   fly launch --no-deploy        # pick a unique app name; this file will be rewritten
#   fly deploy
#
# The frontend deploys to Cloudflare Pages (or Vercel). Set its
# NEXT_PUBLIC_PARTYKIT_HOST env to this Fly app's hostname
# (e.g. "chaos-cards-server.fly.dev"), no scheme.
#
# Free-allowance notes:
# - Keep auto_stop_machines = true so the machine suspends when idle. Machines
#   wake on first socket; the client already reports "Waking the game server…"
#   during the cold start (see src/hooks/useRoom.ts).
# - min_machines_running = 0 keeps the allowance footprint small.

app = "chaos-cards-server"  # replace during `fly launch`
primary_region = "iad"       # replace with your nearest Fly region

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "1999"

[http_service]
  internal_port = 1999
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  # Simple GET on "/" returns 200 (the server answers any HTTP request with a
  # tiny health response) so this doubles as a readiness probe.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
