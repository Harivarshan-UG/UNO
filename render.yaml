# Render Blueprint for the Custom UNO game server (the standalone Node
# WebSocket backend in server/index.ts). Render reads this on "New +
# Blueprint" and provisions the service automatically.
#
# The frontend (Next.js) is deployed separately on Vercel — see DEPLOYMENT.md.
services:
  - type: web
    name: custom-uno-server
    runtime: node
    plan: free
    # Install only production deps (skips partykit's workerd download, etc.).
    # Nuclear install: wipe node_modules AND npm's cacache, then install with
    # --legacy-peer-deps. The "Cannot read properties of null (reading
    # 'edgesOut')" bug comes from a corrupt cached dep graph that survives a
    # plain `rm -rf node_modules`. Clearing ~/.npm/_cacache forces fresh
    # tarball fetches and rebuilds the graph from scratch.
    buildCommand: rm -rf node_modules && npm cache clean --force && npm install --omit=dev --no-audit --no-fund --legacy-peer-deps
    startCommand: npm run start:server
    # Our server answers plain HTTP GETs with 200, so this doubles as a health check.
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
